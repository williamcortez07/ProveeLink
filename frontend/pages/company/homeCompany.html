<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Empresa · ProveeLink</title>

    <link rel="stylesheet" href="../../css/base/globals.css" />

    <script type="module" src="../../js/utils/sidebar.js"></script>
    <script type="module" src="../../js/utils/navbar.js"></script>
