<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Calificaciones · ProveeLink</title>
    <meta
      name="description"
      content="Consulta y gestiona las calificaciones que has dejado en proveedores de ProveeLink."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base/globals.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/footer.css" />
    <link rel="stylesheet" href="../css/layout/favorites.css" />
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-target"></div>
      <div id="navbar-target"></div>

      <main>
        <div class="section-inner" style="padding-block: 32px">

          <!-- Header de la página -->
          <div class="fav-page-header">
            <div>
              <h1 class="fav-page-title">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                Mis Calificaciones
              </h1>
              <p class="fav-page-subtitle">
                Proveedores que has calificado en ProveeLink
              </p>
            </div>
            <span class="fav-counter-badge" id="favoritesCounter"></span>
          </div>

          <!-- Banner informativo -->
          <div class="fav-info-banner" role="note">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>
              Aquí aparecen los proveedores que has calificado con estrellas.
              Visita el perfil de un proveedor para dejar tu calificación.
            </span>
          </div>

          <!-- Grilla de calificaciones (se llena dinámicamente) -->
          <div class="fav-grid" id="favoritesGrid" aria-live="polite">
            <!-- Los favoritos se renderizan aquí vía favorites.js -->
          </div>

        </div>
      </main>

      <div id="footer-target"></div>
    </div>

    <script type="module" src="../js/utils/sidebar.js"></script>
    <script type="module" src="../js/utils/navbar.js"></script>
    <script type="module" src="../js/utils/footer.js"></script>
    <script type="module" src="../js/favorites.js"></script>
  </body>
</html>
