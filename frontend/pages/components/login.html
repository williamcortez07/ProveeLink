<div class="login-container">
  <div class="login-header">
    <div class="logo">
      <span class="logo-provee">Provee</span><span class="logo-link">Link</span>
    </div>
    <p class="slogan">
      Conectamos proveedores, impulsamos
      <span class="accent-text">oportunidades.</span>
    </p>

    <h2 class="welcome-title">¡Bienvenido de nuevo!</h2>
    <p class="welcome-subtitle">Inicia sesión para continuar</p>
  </div>

  <form class="login-form">
    <div class="input-card">
      <div class="input-icon">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="input-field-wrapper">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="ejemplo@proveelink.com"
          required
        />
      </div>
    </div>

    <div class="input-card">
      <div class="input-icon">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="input-field-wrapper">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          required
        />
      </div>
      <button
        type="button"
        class="toggle-password"
        aria-label="Mostrar contraseña"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" id="remember" />
        <span class="custom-checkbox"></span>
        Recordarme
      </label>
      <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="btn-submit">
      <span>Iniciar sesión</span>
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <div class="login-footer">
    <p>
      ¿No tienes una cuenta? <a href="#" class="register-link">Regístrate</a>
    </p>
  </div>

  <div class="bottom-wave">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path
        fill="#0d2c54"
        d="M0,224L120,240C240,256,480,288,720,288C960,288,1200,256,1320,240L1440,224L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"
      ></path>
    </svg>
  </div>
</div>
